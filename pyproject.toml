[project]
name = "control-tower"
version = "0.1.0"
description = "Control Tower — decline-signature attribution for a payment orchestrator (NextWave 2026, Challenge 02)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = [
    # The simulated clock is deliberately naive: there is one clock in this system
    # and it is not wall time, so a tzinfo would be a lie.
    "DTZ001", "DTZ005",
    # Blind excepts are load-bearing here: the agent loop, the tool dispatch and the
    # diagnosis task must degrade rather than die. Each one is commented at the site.
    "BLE001", "S110",
    "C408",
]

[tool.pytest.ini_options]
testpaths = ["eval", "api"]
